workflows:
  ios-appstore:
    name: iOS App Store (국가유산 방문 스탬프)
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: ASC
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.qniweb.stamp
      vars:
        XCODE_WORKSPACE: "국가유산스탬프.xcworkspace"
        XCODE_SCHEME: "국가유산스탬프"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: pod install
      - name: Set up provisioning profiles
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
