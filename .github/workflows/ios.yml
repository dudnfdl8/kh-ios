name: iOS App Store

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.ASC_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      CERT_PRIVATE_KEY: ${{ secrets.CERT_PRIVATE_KEY }}
      BUNDLE_ID: "com.qniweb.stamp"
      TEAM_ID: "8WJ2MA2C78"
      XCODE_WORKSPACE: "KHStamp.xcworkspace"
      XCODE_SCHEME: "KHStamp"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Select Xcode 26 (iOS 26 SDK required by App Store)
        run: |
          ls -d /Applications/Xcode*.app || true
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$XC" ]; then XC=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1); fi
          echo "Selecting $XC"
          sudo xcode-select -s "$XC/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install Codemagic CLI tools
        run: pip install codemagic-cli-tools

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Set up signing (cert + App Store profile, manual)
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > ~/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_IDENTIFIER}.p8
          keychain initialize
          printf '%s' "$CERT_PRIVATE_KEY" > /tmp/cert_key.pem
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @file:/tmp/cert_key.pem \
            --create
          keychain add-certificates
          # Apply the fetched App Store profile to every target as MANUAL signing
          xcode-project use-profiles

      - name: Archive (manual signing via use-profiles)
        run: |
          xcodebuild -workspace "$XCODE_WORKSPACE" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            archive

      - name: Export IPA (manual, using the profile embedded in the archive)
        run: |
          PROFILE_NAME=""
          # 1) Most reliable: read the profile embedded in the just-built archive
          APP_DIR=$(ls -d "$RUNNER_TEMP"/app.xcarchive/Products/Applications/*.app 2>/dev/null | head -1)
          EMB="$APP_DIR/embedded.mobileprovision"
          if [ -f "$EMB" ]; then
            security cms -D -i "$EMB" -o /tmp/p.plist 2>/dev/null \
              && PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/p.plist 2>/dev/null)
          fi
          # 2) Fallback: scan both known provisioning-profile directories
          if [ -z "$PROFILE_NAME" ]; then
            for PROF_DIR in \
              "$HOME/Library/MobileDevice/Provisioning Profiles" \
              "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              [ -d "$PROF_DIR" ] || continue
              for f in "$PROF_DIR"/*.mobileprovision "$PROF_DIR"/*.provisionprofile; do
                [ -e "$f" ] || continue
                security cms -D -i "$f" -o /tmp/p.plist 2>/dev/null || continue
                appid=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" /tmp/p.plist 2>/dev/null)
                gta=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:get-task-allow" /tmp/p.plist 2>/dev/null)
                name=$(/usr/libexec/PlistBuddy -c "Print :Name" /tmp/p.plist 2>/dev/null)
                case "$appid" in
                  *"$BUNDLE_ID")
                    if [ "$gta" != "true" ]; then PROFILE_NAME="$name"; break 2; fi ;;
                esac
              done
            done
          fi
          echo "Selected provisioning profile: $PROFILE_NAME"
          if [ -z "$PROFILE_NAME" ]; then echo "No distribution profile found"; exit 1; fi
          printf '%s\n' \
            '<?xml version="1.0" encoding="UTF-8"?>' \
            '<plist version="1.0">' \
            '<dict>' \
            '<key>method</key><string>app-store-connect</string>' \
            '<key>signingStyle</key><string>manual</string>' \
            "<key>teamID</key><string>$TEAM_ID</string>" \
            '<key>provisioningProfiles</key>' \
            '<dict>' \
            "<key>$BUNDLE_ID</key><string>$PROFILE_NAME</string>" \
            '</dict>' \
            '<key>uploadSymbols</key><true/>' \
            '</dict>' \
            '</plist>' > /tmp/ExportOptions.plist
          cat /tmp/ExportOptions.plist
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/app.xcarchive" \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          app-store-connect publish --path "$RUNNER_TEMP/export/*.ipa" --testflight

      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
