workflows:
  ios-appstore:
    name: iOS App Store (국가유산 방문 스탬프)
    instance_type: mac_mini_m1
    max_build_duration: 60
    integrations:
      app_store_connect: ASC
    environment:
      vars:
        XCODE_WORKSPACE: "국가유산스탬프.xcworkspace"
        XCODE_SCHEME: "국가유산스탬프"
        BUNDLE_ID: "com.qniweb.stamp"
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install CocoaPods dependencies
        script: pod install
      - name: Set up code signing (create cert & profile if missing)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
